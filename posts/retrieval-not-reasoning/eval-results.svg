<svg width="100%" viewBox="0 0 740 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Agent scores by question type</title>
<desc>Grouped bar chart of three metrics for factual versus longitudinal questions, three runs each. Factual: recall 86.9 percent, groundedness 96.0 percent, retrieval ceiling 86.8 percent. Longitudinal: recall 32.2 percent, groundedness 97.9 percent, retrieval ceiling 43.5 percent. Recall and the retrieval ceiling are far lower for longitudinal questions, while groundedness is high for both.</desc>

<rect x="0" y="0" width="740" height="460" fill="#ffffff"/>

<!-- legend -->
<rect x="150" y="28" width="14" height="14" rx="2" fill="#534AB7"/>
<text x="170" y="40" font-size="12.5" fill="#444441">Recall</text>
<rect x="238" y="28" width="14" height="14" rx="2" fill="#0F6E56"/>
<text x="258" y="40" font-size="12.5" fill="#444441">Groundedness</text>
<rect x="378" y="28" width="14" height="14" rx="2" fill="#B04A30"/>
<text x="398" y="40" font-size="12.5" fill="#444441">Retrieval ceiling</text>

<!-- y gridlines + ticks -->
<g stroke="#EAE8E2" stroke-width="1">
  <line x1="70" y1="400" x2="700" y2="400"/>
  <line x1="70" y1="334" x2="700" y2="334"/>
  <line x1="70" y1="268" x2="700" y2="268"/>
  <line x1="70" y1="202" x2="700" y2="202"/>
  <line x1="70" y1="136" x2="700" y2="136"/>
  <line x1="70" y1="70"  x2="700" y2="70"/>
</g>
<g font-size="11" fill="#52514E" text-anchor="end">
  <text x="60" y="404">0</text>
  <text x="60" y="338">20</text>
  <text x="60" y="272">40</text>
  <text x="60" y="206">60</text>
  <text x="60" y="140">80</text>
  <text x="60" y="74">100</text>
</g>
<text x="24" y="235" font-size="12" fill="#52514E" text-anchor="middle" transform="rotate(-90 24 235)">Percent</text>

<!-- baseline -->
<line x1="70" y1="400" x2="700" y2="400" stroke="#898781" stroke-width="1"/>

<!-- Factual group -->
<rect x="163" y="113" width="44" height="287" fill="#534AB7"/>
<text x="185" y="106" font-size="12" fill="#3C3489" text-anchor="middle">86.9</text>
<rect x="215" y="83" width="44" height="317" fill="#0F6E56"/>
<text x="237" y="76" font-size="12" fill="#085041" text-anchor="middle">96.0</text>
<rect x="267" y="114" width="44" height="286" fill="#B04A30"/>
<text x="289" y="107" font-size="12" fill="#8F3A24" text-anchor="middle">86.8</text>
<text x="237" y="420" font-size="13" fill="#444441" text-anchor="middle">Factual</text>

<!-- Longitudinal group -->
<rect x="499" y="294" width="44" height="106" fill="#534AB7"/>
<text x="521" y="287" font-size="12" fill="#3C3489" text-anchor="middle">32.2</text>
<rect x="551" y="77" width="44" height="323" fill="#0F6E56"/>
<text x="573" y="70" font-size="12" fill="#085041" text-anchor="middle">97.9</text>
<rect x="603" y="256" width="44" height="144" fill="#B04A30"/>
<text x="625" y="249" font-size="12" fill="#8F3A24" text-anchor="middle">43.5</text>
<text x="573" y="420" font-size="13" fill="#444441" text-anchor="middle">Longitudinal</text>
</svg>
