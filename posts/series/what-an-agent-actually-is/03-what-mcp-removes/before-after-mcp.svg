<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
<title>Host code before and after MCP</title>
<desc>Without MCP, the host holds a TOOLS list and a DISPATCH map with one hand-written entry per tool source, wired separately to each source. With MCP, the host still has TOOLS and DISPATCH, but builds both at startup from what each server reports over tools/list, and each server owns its own tool descriptions.</desc>
<rect id="__bg" x="0" y="0" width="680" height="430" fill="#ffffff"/>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 400; fill: #3d3d3a; }
  .th { font-size: 15px; font-weight: 500; fill: #2c2c2a; }
  .shell { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .warm  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .cool  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .warm-t  { fill: #712B13; }
  .cool-t  { fill: #085041; }
  .line { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .divider { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 4; }
  @media (prefers-color-scheme: dark) {
    .t  { fill: #c2c0b6; }
    .th { fill: #e5e3da; }
    .shell { fill: #2C2C2A; stroke: #B4B2A9; }
    .warm  { fill: #712B13; stroke: #F0997B; }
    .cool  { fill: #085041; stroke: #5DCAA5; }
    .warm-t { fill: #F5C4B3; }
    .cool-t { fill: #9FE1CB; }
    .line { stroke: #B4B2A9; }
    .divider { stroke: #5F5E5A; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="40" y="30">Without MCP</text>
<text class="th" x="380" y="30">With MCP</text>

<rect class="shell" x="40" y="46" width="260" height="200" rx="16"/>
<text class="th" x="60" y="70" dominant-baseline="central">Host</text>

<rect class="warm" x="60" y="86" width="220" height="70" rx="8"/>
<text class="th warm-t" x="170" y="104" text-anchor="middle" dominant-baseline="central">TOOLS</text>
<text class="t warm-t" x="170" y="124" text-anchor="middle" dominant-baseline="central">entry for towns</text>
<text class="t warm-t" x="170" y="142" text-anchor="middle" dominant-baseline="central">entry for weather</text>

<rect class="warm" x="60" y="166" width="220" height="70" rx="8"/>
<text class="th warm-t" x="170" y="184" text-anchor="middle" dominant-baseline="central">DISPATCH</text>
<text class="t warm-t" x="170" y="204" text-anchor="middle" dominant-baseline="central">entry for towns</text>
<text class="t warm-t" x="170" y="222" text-anchor="middle" dominant-baseline="central">entry for weather</text>

<line class="line" x1="118" y1="246" x2="118" y2="290" marker-end="url(#arrow)"/>
<line class="line" x1="222" y1="246" x2="222" y2="290" marker-end="url(#arrow)"/>

<rect class="shell" x="52" y="294" width="132" height="48" rx="8"/>
<text class="t" x="118" y="318" text-anchor="middle" dominant-baseline="central">towns code</text>
<rect class="shell" x="200" y="294" width="132" height="48" rx="8"/>
<text class="t" x="266" y="318" text-anchor="middle" dominant-baseline="central">weather code</text>

<text class="t" x="170" y="380" text-anchor="middle">Every new source means</text>
<text class="t" x="170" y="400" text-anchor="middle">two more hand-written entries</text>

<rect class="shell" x="380" y="46" width="260" height="200" rx="16"/>
<text class="th" x="400" y="70" dominant-baseline="central">Host</text>

<rect class="cool" x="400" y="86" width="220" height="70" rx="8"/>
<text class="th cool-t" x="510" y="112" text-anchor="middle" dominant-baseline="central">TOOLS</text>
<text class="t cool-t" x="510" y="136" text-anchor="middle" dominant-baseline="central">built at startup</text>

<rect class="cool" x="400" y="166" width="220" height="70" rx="8"/>
<text class="th cool-t" x="510" y="192" text-anchor="middle" dominant-baseline="central">DISPATCH</text>
<text class="t cool-t" x="510" y="216" text-anchor="middle" dominant-baseline="central">built at startup</text>

<line class="line" x1="458" y1="290" x2="458" y2="248" marker-end="url(#arrow)"/>
<line class="line" x1="562" y1="290" x2="562" y2="248" marker-end="url(#arrow)"/>
<text class="t" x="510" y="270" text-anchor="middle" dominant-baseline="central">tools/list</text>

<rect class="cool" x="392" y="294" width="132" height="48" rx="8"/>
<text class="t cool-t" x="458" y="311" text-anchor="middle" dominant-baseline="central">towns server</text>
<text class="t cool-t" x="458" y="329" text-anchor="middle" dominant-baseline="central">owns its schemas</text>
<rect class="cool" x="540" y="294" width="132" height="48" rx="8"/>
<text class="t cool-t" x="606" y="311" text-anchor="middle" dominant-baseline="central">weather server</text>
<text class="t cool-t" x="606" y="329" text-anchor="middle" dominant-baseline="central">owns its schemas</text>

<text class="t" x="510" y="380" text-anchor="middle">Every new source means</text>
<text class="t" x="510" y="400" text-anchor="middle">one line of config</text>

<line class="divider" x1="340" y1="46" x2="340" y2="342"/>
</svg>
