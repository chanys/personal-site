<svg width="100%" viewBox="0 0 1000 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The AnswerTrail ReAct loop</title>
<desc>A question enters a stateless agent loop. The loop either calls search_transcripts, which runs a dense pgvector search and returns the top-10 chunks to read, or calls mark_ready. A guardrail check, "explored enough?", sends the run back to keep searching until it has explored enough, then a final submit_answer turn validates every citation against the corpus before emitting the answer; a rejected citation returns to be fixed, and an accepted answer with citations is the loop's stop signal.</desc>

<rect x="0" y="0" width="1000" height="300" fill="#ffffff"/>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#B04A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- edges (drawn first so nodes sit on top) -->
<!-- question -> loop -->
<line x1="112" y1="170" x2="142" y2="170" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<!-- loop -> retrieval (search) -->
<line x1="210" y1="144" x2="240" y2="88" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="200" y="116" text-anchor="end" font-size="11" fill="#5F5E5A">search_transcripts</text>
<!-- retrieval -> loop (read) -->
<line x1="288" y1="88" x2="258" y2="144" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="300" y="116" text-anchor="start" font-size="11" fill="#5F5E5A">read top-10</text>
<!-- loop -> explored? -->
<line x1="298" y1="170" x2="380" y2="170" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="339" y="161" text-anchor="middle" font-size="11" fill="#52514E">mark_ready</text>
<!-- explored? no -> loop -->
<path d="M438,206 C438,252 221,252 221,198" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="330" y="248" text-anchor="middle" font-size="11" fill="#52514E">no</text>
<!-- explored? yes -> submit -->
<line x1="496" y1="170" x2="566" y2="170" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="531" y="161" text-anchor="middle" font-size="11" fill="#52514E">yes</text>
<!-- submit reject self-loop (warm) -->
<path d="M602,142 C602,114 700,114 700,142" fill="none" stroke="#B04A30" stroke-width="1.5" marker-end="url(#arw)"/>
<text x="651" y="108" text-anchor="middle" font-size="11" fill="#B04A30">citation rejected, fix</text>
<!-- submit -> answer -->
<line x1="734" y1="170" x2="812" y2="170" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>

<!-- nodes -->
<!-- Question (neutral pill) -->
<rect x="16" y="150" width="96" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="64" y="174" text-anchor="middle" font-size="13" fill="#444441">Question</text>

<!-- Dense retrieval (neutral) -->
<rect x="156" y="36" width="196" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="254" y="58" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Dense pgvector</text>
<text x="254" y="75" text-anchor="middle" font-size="11" fill="#5F5E5A">top-10 chunks</text>

<!-- Agent loop (purple) -->
<rect x="146" y="144" width="152" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="222" y="167" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Agent loop</text>
<text x="222" y="185" text-anchor="middle" font-size="11" fill="#534AB7">stateless model</text>

<!-- explored enough? (neutral diamond) -->
<polygon points="438,136 496,170 438,206 380,170" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="438" y="167" text-anchor="middle" font-size="11.5" fill="#444441">explored</text>
<text x="438" y="182" text-anchor="middle" font-size="11.5" fill="#444441">enough?</text>

<!-- submit_answer (purple) -->
<rect x="566" y="142" width="168" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="650" y="165" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">submit_answer</text>
<text x="650" y="183" text-anchor="middle" font-size="11" fill="#534AB7">validate every citation</text>

<!-- Answer + citations (green terminal pill) -->
<rect x="812" y="148" width="172" height="44" rx="22" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="898" y="174" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Answer + citations</text>
</svg>
