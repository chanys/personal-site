<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img">
<title>A hand-copied tool description goes out of date</title>
<desc>Two columns. On the left, the tool owner's function. On the right, the host's hand-written copy of its description. At first both say get_housing takes one argument, town, and they match. Later the owner adds a second required argument, year, but the host copy still says one argument, so the model calls the tool the old way.</desc>
<rect id="__bg" x="0" y="0" width="680" height="320" fill="#ffffff"/>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 400; fill: #3d3d3a; }
  .th { font-size: 15px; font-weight: 500; fill: #2c2c2a; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 500; }
  .shell { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .warm  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .cool  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .shell-t { fill: #2C2C2A; }
  .warm-t  { fill: #712B13; }
  .cool-t  { fill: #085041; }
  .line { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .match { stroke: #5F5E5A; stroke-width: 0.5; }
  .mismatch { stroke: #5F5E5A; stroke-width: 0.5; stroke-dasharray: 4 4; }
  @media (prefers-color-scheme: dark) {
    .t  { fill: #c2c0b6; }
    .th { fill: #e5e3da; }
    .shell { fill: #2C2C2A; stroke: #B4B2A9; }
    .warm  { fill: #712B13; stroke: #F0997B; }
    .cool  { fill: #085041; stroke: #5DCAA5; }
    .shell-t { fill: #e5e3da; }
    .warm-t { fill: #F5C4B3; }
    .cool-t { fill: #9FE1CB; }
    .line, .match, .mismatch { stroke: #B4B2A9; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="t" x="250" y="34" text-anchor="middle">Tool owner's function</text>
<text class="t" x="510" y="34" text-anchor="middle">Host's copy of it</text>

<text class="th" x="40" y="86" dominant-baseline="central">At first</text>
<rect class="shell" x="150" y="58" width="200" height="56" rx="8"/>
<text class="mono shell-t" x="250" y="86" text-anchor="middle" dominant-baseline="central">get_housing(town)</text>
<rect class="shell" x="410" y="58" width="200" height="56" rx="8"/>
<text class="mono shell-t" x="510" y="86" text-anchor="middle" dominant-baseline="central">get_housing(town)</text>
<line class="match" x1="352" y1="86" x2="406" y2="86"/>

<text class="th" x="40" y="176" dominant-baseline="central">Later</text>
<rect class="cool" x="150" y="148" width="200" height="56" rx="8"/>
<text class="mono cool-t" x="250" y="176" text-anchor="middle" dominant-baseline="central">get_housing(town, year)</text>
<rect class="warm" x="410" y="148" width="200" height="56" rx="8"/>
<text class="mono warm-t" x="510" y="176" text-anchor="middle" dominant-baseline="central">get_housing(town)</text>
<line class="mismatch" x1="352" y1="176" x2="406" y2="176"/>

<line class="line" x1="510" y1="212" x2="510" y2="244" marker-end="url(#arrow)"/>
<rect class="warm" x="330" y="248" width="280" height="48" rx="8"/>
<text class="t warm-t" x="470" y="272" text-anchor="middle" dominant-baseline="central">the model calls it the old way</text>
</svg>
